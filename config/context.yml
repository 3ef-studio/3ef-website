# 3EF Studio – Global Context
brand:
  name: "Three Eagles Forge Studio"
  short_name: "3EF Studio"
  tagline: "Ship small. Learn fast. Soar Higher."
  logo:
    light: "/logo/light.svg"
    dark: "/logo/dark.svg"
    favicon: "/favicon.svg"
  colors:
    background: "#0B0F14"
    card: "#11161C"
    text: "#E7ECF2"
    muted: "#9FB0C0"
    accent: "#5EEAD4"
    accent2: "#60A5FA"
  fonts:
    heading: "Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Noto Sans, 'Apple Color Emoji', 'Segoe UI Emoji'"
    body: "Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Noto Sans"
    scale:
    xs: "0.75rem"
    sm: "0.875rem"
    base: "1rem"
    lg: "1.125rem"
    xl: "1.25rem"
    "2xl": "1.5rem"
    "3xl": "1.875rem"
    "4xl": "2.25rem"
radii:
  xl: "1rem"
  2xl: "1.25rem"
motion:
  hover: "200ms"
  enter: "250ms"


# NOTE: This file is a hand-maintained design-token reference only.
# Nothing in the application reads context.yml at build or runtime
# (there is no YAML parser in this project) — it exists to document
# the intended brand/token source of truth for humans and agents.
#
# For current feature status, active integrations, and site phase,
# see /docs/PROJECT_STATE.md and /docs/INTEGRATIONS.md instead of
# duplicating that information here — those are the living sources
# of truth for "what's true today."

flags:
  dark_mode_default: true

env:
  hosting: "vercel"
  domain: "3ef.studio"
